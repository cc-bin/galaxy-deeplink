<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>打开银河度假 App</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f7f8fa; color: #242424; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 20px; }
    main { width: min(100%, 520px); padding: 28px 22px; background: #fff; border-radius: 18px; box-shadow: 0 8px 30px #0000000b; }
    h1 { font-size: 22px; text-align: center; margin: 0 0 22px; }
    .label { font-size: 13px; color: #666; margin: 14px 0 8px; }
    .url { background: #f5f6f8; border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; user-select: text; }
    .buttons { display: grid; gap: 12px; margin-top: 24px; }
    button { width: 100%; border: 0; border-radius: 11px; background: #8b6a35; color: #fff; padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #3c4655; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { font-size: 12px; color: #777; line-height: 1.6; margin: 16px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>打开银河度假 App</h1>
    <div class="label">当前页面链接</div>
    <div class="url" id="pageUrl"></div>
    <div class="label">当前分享链接（App Links / Universal Links）</div>
    <div class="url" id="sharingUrl"></div>
    <div class="label">Scheme 链接</div>
    <div class="url" id="schemeUrl"></div>
    <div class="buttons">
      <button id="openApp" type="button">通过 App Links 打开</button>
      <button id="openScheme" class="secondary" type="button">通过 Scheme 打开</button>
    </div>
    <p class="hint" id="hint">如果第一个按钮无法唤起 App，请返回此页面点击第二个按钮。</p>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    $('pageUrl').textContent = location.href;
    const raw = new URLSearchParams(location.search).get('sharing');
    let target = null;
    try {
      const parsed = new URL(raw);
      if (parsed.protocol !== 'https:' || parsed.hostname !== 'mgpcapp.galaxymacau.com' || !parsed.pathname.startsWith('/route/')) {
        throw new Error('Invalid URL');
      }
      target = parsed;
    } catch (_) {}

    if (!target) {
      $('sharingUrl').textContent = '无效或缺少 sharing 参数';
      $('schemeUrl').textContent = '无法生成';
      $('openApp').disabled = true;
      $('openScheme').disabled = true;
      $('hint').textContent = '请在 URL 中传入合法的 sharing 参数。';
    } else {
      // 假设 App 支持 gpcmobile://route/...；需与客户端路由配置核对。
      const scheme = 'gpcmobile://route' + target.pathname.slice('/route'.length) + target.search + target.hash;
      $('sharingUrl').textContent = target.href;
      $('schemeUrl').textContent = scheme;
      $('openApp').addEventListener('click', () => { location.href = target.href; });
      $('openScheme').addEventListener('click', () => { location.href = scheme; });
    }
  </script>
</body>
</html>
