<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打开银河度假 App</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202c}.card{width:min(92vw,460px);background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px #172b4d12}h1{font-size:22px;margin:0 0 22px;text-align:center}.label{font-size:13px;color:#64748b;margin:14px 0 6px}.url{font-size:13px;overflow-wrap:anywhere;background:#f1f5f9;padding:12px;border-radius:9px;line-height:1.6}.button{display:block;width:100%;border:0;border-radius:10px;padding:14px;background:#1458d4;color:white;font-size:16px;font-weight:600;cursor:pointer;margin-top:22px}.tip{font-size:12px;color:#64748b;margin-top:14px;text-align:center}
</style>
</head>
<body>
<main class="card">
  <h1>打开银河度假 App</h1>
  <div class="label">当前页面链接</div><div class="url" id="pageUrl"></div>
  <div class="label">当前分享链接</div><div class="url" id="shareUrl"></div>
  <button class="button" id="openBtn" disabled>打开 App</button>
  <div class="tip" id="tip"></div>
</main>
<script>
(function(){
  'use strict';
  const pageUrl=document.getElementById('pageUrl');
  const shareUrl=document.getElementById('shareUrl');
  const button=document.getElementById('openBtn');
  const tip=document.getElementById('tip');
  pageUrl.textContent=location.href;
  const params=new URLSearchParams(location.search);
  const sharing=params.get('sharing');
  let target;
  try {
    target=new URL(sharing);
    if(target.protocol!=='https:' || target.hostname!=='mgpcapp.galaxymacau.com' || !target.pathname.startsWith('/route/')) throw new Error('invalid');
  } catch(e){
    shareUrl.textContent='无效或缺失的 sharing 参数';
    tip.textContent='请通过包含有效 sharing 参数的链接访问。';
    return;
  }
  shareUrl.textContent=target.href;
  const ua=navigator.userAgent;
  const isAndroid=/Android/i.test(ua);
  const isIOS=/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  // 注意：scheme 的 host/path 必须与 Android App 的 intent-filter 和路由解析规则匹配。
  // https://host/route/hotel_detail?id=x => gpcmobile://route/hotel_detail?id=x
  const scheme='gpcmobile://'+target.pathname.replace(/^\/+/, '')+target.search+target.hash;
  button.disabled=false;
  button.addEventListener('click',function(){
    if(isAndroid){location.href=scheme;}
    else {location.href=target.href;}
  });
  tip.textContent=isAndroid?'Android：使用 Scheme 打开':isIOS?'iOS：使用 Universal Links 打开':'其他平台：使用 HTTPS 链接打开';
})();
</script>
</body>
</html>
