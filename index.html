<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>打开银河度假 App</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f5f6f9; color:#202633; }
    main { width:min(420px, calc(100% - 48px)); padding:32px 24px; background:#fff; border-radius:18px; box-shadow:0 10px 35px #19233c14; text-align:center; }
    h1 { font-size:22px; margin:0 0 12px; } p { line-height:1.65; color:#667085; font-size:14px; }
    a { display:block; text-decoration:none; border-radius:10px; padding:14px 12px; margin-top:12px; font-weight:600; }
    .primary { background:#174c85; color:white; } .secondary { color:#174c85; border:1px solid #b9c8d9; }
    .hint { font-size:12px; margin-top:22px; } [hidden] { display:none!important; }
  </style>
</head>
<body>
<main>
  <h1>银河度假</h1>
  <p id="status">正在准备打开 App…</p>
  <a id="universal" class="primary" href="#" hidden>打开 App（官方链接）</a>
  <a id="scheme" class="secondary" href="#" hidden>尝试通过 Scheme 打开</a>
  <a id="download" class="secondary" href="#" hidden>下载 App</a>
  <p id="hint" class="hint">如在微信等内置浏览器中无法打开，请通过浏览器菜单选择“在浏览器中打开”。</p>
</main>
<script>
(() => {
  'use strict';
  const CONFIG = {
    allowedHost: 'mgpcapp.galaxymacau.com',
    allowedPathPrefix: '/route/',
    // IMPORTANT: Verify your Android/iOS app actually handles this URI format.
    schemePrefix: 'gpcmobile://',
    // Replace these with your actual store links before production.
    iosStore: '',
    androidStore: '',
    autoAttempt: false // Explicit tap is most reliable, especially on iOS.
  };
  const $ = id => document.getElementById(id);
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function getSharing() {
    const params = new URLSearchParams(location.search);
    const normal = params.get('sharing');
    if (normal) return normal;
    // Legacy malformed URL: /index.html/sharing?=https://... ; also ?=https://...
    const raw = location.search.startsWith('?=') ? location.search.slice(2) : null;
    return raw ? decodeURIComponent(raw) : null;
  }
  function parseTarget(value) {
    if (!value) return null;
    try {
      const url = new URL(value);
      if (url.protocol !== 'https:' || url.hostname !== CONFIG.allowedHost || url.port ||
          url.username || url.password || !url.pathname.startsWith(CONFIG.allowedPathPrefix)) return null;
      return url;
    } catch { return null; }
  }
  const target = parseTarget(getSharing());
  if (!target) {
    $('status').textContent = '分享链接无效或缺少 sharing 参数。';
    $('hint').textContent = '请检查链接格式：index.html?sharing=编码后的 HTTPS App Link';
    return;
  }
  const universalUrl = target.href;
  // Example mapping: https://host/route/hotel_detail?id=...
  //               -> gpcmobile://route/hotel_detail?id=...
  // Actual mapping MUST match the native app's intent filter/router.
  const schemeUrl = CONFIG.schemePrefix + target.pathname.slice(1) + target.search + target.hash;
  $('universal').href = universalUrl;
  $('scheme').href = schemeUrl;
  $('universal').hidden = false;
  $('scheme').hidden = false;
  $('status').textContent = '点击下方按钮打开 App。';
  const store = isIOS ? CONFIG.iosStore : isAndroid ? CONFIG.androidStore : '';
  if (store) { $('download').href = store; $('download').hidden = false; }
  // Do not chain timed universal-link, scheme and store redirects: browsers cannot
  // reliably determine app installation, and such redirects can loop or misfire.
  if (CONFIG.autoAttempt && (isAndroid || isIOS)) {
    $('status').textContent = '正在尝试打开 App；如果没有响应，请点击下方按钮。';
    // Automatic JS navigation may be blocked or may stay in the browser.
    window.location.assign(universalUrl);
  }
})();
</script>
</body>
</html>
