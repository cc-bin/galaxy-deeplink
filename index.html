<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打开银河度假 App</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202c}.card{width:min(92vw,460px);background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px #172b4d12}h1{font-size:22px;margin:0 0 22px;text-align:center}.label{font-size:13px;color:#64748b;margin:14px 0 6px}.url{font-size:13px;overflow-wrap:anywhere;background:#f1f5f9;padding:12px;border-radius:9px;line-height:1.6}.button{display:block;width:100%;border:0;border-radius:10px;padding:14px;background:#1458d4;color:white;font-size:16px;font-weight:600;cursor:pointer;margin-top:22px;text-align:center;text-decoration:none}.button[aria-disabled="true"]{opacity:.55;pointer-events:none}.tip{font-size:12px;color:#64748b;margin-top:14px;text-align:center}
</style>
</head>
<body>
<main class="card">
  <h1>打开银河度假 App</h1>
  <div class="label">当前页面链接</div><div class="url" id="pageUrl"></div>
  <div class="label">当前分享链接</div><div class="url" id="shareUrl"></div>
  <a class="button" id="openBtn" href="#" aria-disabled="true">打开 App</a>
  <div class="tip" id="tip"></div>
</main>
<script>
(function(){
  'use strict';
  const pageUrl=document.getElementById('pageUrl');
  const shareUrl=document.getElementById('shareUrl');
  const button=document.getElementById('openBtn');
  const tip=document.getElementById('tip');
  pageUrl.textContent=location.href;
  const params=new URLSearchParams(location.search);
  const sharing=params.get('sharing');
  let target;
  try {
    target=new URL(sharing);
    if(target.protocol!=='https:' || !['mgpcapp.galaxymacau.com','mgpcapp.gegtlab.com'].includes(target.hostname)) throw new Error('invalid');
  } catch(e){
    shareUrl.textContent='无效或缺失的 sharing 参数';
    tip.textContent='请通过包含有效 sharing 参数的链接访问。';
    return;
  }
  shareUrl.textContent=target.href;
  const ua=navigator.userAgent;
  const isAndroid=/Android/i.test(ua);
  const isWeChat=/MicroMessenger/i.test(ua);
  const isIOS=/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  // https://host/route/hotel_detail?id=x => gpcmobile://route/hotel_detail?id=x
  const scheme='gpcmobile://'+target.pathname.replace(/^\/+/, '')+target.search+target.hash;
  const playStore='https://play.google.com/store/apps/details?id=com.galaxyentertainment.gpcmobile';
  const appStore='https://apps.apple.com/cn/app/%E9%93%B6%E6%B2%B3%E5%BA%A6%E5%81%87/id1451146460';
  const fallbackTimeout=1500;
  if(isAndroid && isWeChat){
    button.textContent='请使用手机浏览器打开';
    button.removeAttribute('href');
    button.setAttribute('aria-disabled','true');
    tip.textContent='Android 微信内置浏览器暂不支持唤起 App，请点击右上角菜单并选择“在浏览器打开”。';
    return;
  }
  button.href=(isAndroid || isIOS)?scheme:target.href;
  button.removeAttribute('aria-disabled');
  let launchTimer=null;
  let appLeftPage=false;
  function cancelFallback(){
    appLeftPage=true;
    if(launchTimer!==null){clearTimeout(launchTimer);launchTimer=null;}
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) cancelFallback();
  });
  window.addEventListener('pagehide',cancelFallback);
  button.addEventListener('click',function(event){
    if(button.getAttribute('aria-disabled')==='true'){
      event.preventDefault();
      return;
    }
    if(!isAndroid && !isIOS) return;
    appLeftPage=false;
    if(launchTimer!==null) clearTimeout(launchTimer);
    // 参考 Deeplink 解码页：链接未唤起 App、页面仍可见时，跳转到应用商店。
    launchTimer=setTimeout(function(){
      launchTimer=null;
      if(!appLeftPage && !document.hidden) location.href=isAndroid?playStore:appStore;
    },fallbackTimeout);
  });
  tip.textContent=isAndroid?'Android：优先使用 Scheme，未检测到唤起时尝试 Google Play':isIOS?'iOS：优先使用 Scheme，未检测到唤起时尝试 App Store（受浏览器限制）':'其他平台：使用 HTTPS 链接打开';
})();
</script>
</body>
</html>
